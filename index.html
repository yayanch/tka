<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi TKA SMK TJKT - Bank 400 Soal & Pembahasan</title>
    <meta name="description" content="Aplikasi latihan dan simulasi interaktif 400 soal TKA SMK Teknik Jaringan Komputer dan Telekomunikasi (8 Minggu x 50 soal) dengan skor real-time, pembahasan komprehensif, dan pelacakan progres belajar." />
    <meta property="og:title" content="Simulasi TKA SMK TJKT - Bank 400 Soal & Pembahasan" />
    <meta property="og:description" content="Aplikasi latihan dan simulasi interaktif 400 soal TKA SMK Teknik Jaringan Komputer dan Telekomunikasi (8 Minggu x 50 soal) dengan skor real-time, pembahasan komprehensif, dan pelacakan progres belajar." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('tka_app_theme_v1');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
